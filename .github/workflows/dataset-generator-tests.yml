name: Dataset Generator Tests

on:
  push:
    branches:
      - feature/dataset-xml-scenarios-export
  pull_request:
    branches:
      - feature/expand-dataset-studio

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Compile
        run: python -m compileall generator/src/dataset_generator
      - name: Test
        run: pytest -q
